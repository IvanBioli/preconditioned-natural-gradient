[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "randngd"
version = "0.1.0"
description = "Natural gradient descent for neural PDE solvers with randomized (Nyström, RPCholesky) preconditioners"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Ivan Bioli" },
  { name = "Carlo Marcati" },
  { name = "Giancarlo Sangalli" },
]
dependencies = [
  "jax>=0.4.38",
  "equinox>=0.11",
  "optimistix>=0.0.11,<0.2",
  "optax>=0.2.4,<0.3",
  "jaxtyping",
]

[project.optional-dependencies]
examples = ["flax>=0.12", "tensorboardX", "scipy", "ssbroyden-optimistix>=0.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/randngd"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CITATION.cff"]
